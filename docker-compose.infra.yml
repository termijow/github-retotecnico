services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: always
    depends_on:
      - backend
    networks:
      - infra-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.github-profile.rule=Host(`github-profile.prismabitesting.xyz`)"
      - "traefik.http.routers.github-profile.entrypoints=websecure"
      - "traefik.http.routers.github-profile.tls=true"
      - "traefik.http.services.github-profile.loadbalancer.server.port=3000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: always
    networks:
      - infra-public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.github-profile-api.rule=Host(`github-profile.prismabitesting.xyz`) && PathPrefix(`/api`)"
      - "traefik.http.routers.github-profile-api.entrypoints=websecure"
      - "traefik.http.routers.github-profile-api.tls=true"
      - "traefik.http.services.github-profile-api.loadbalancer.server.port=3001"

networks:
  infra-public:
    external: true